# One workspace. Which crate may depend on which is declared in `layout.toml`
# and refused by the check in `crates/layout` rather than left to whatever
# imported what first (#19).
[workspace]
resolver = "2"
members = [
    "crates/units",
    "crates/formats",
    "crates/generator",
    "crates/methods/frogcrab",
    "crates/scoring",
    "crates/ensemble",
    "crates/layout",
    "crates/tree",
    "crates/messlatte",
]

[workspace.package]
version = "0.0.0"
edition = "2021"

# The oldest toolchain this workspace is built with, and the promise an operator
# on a distribution that ships something older is held to (#23).
#
# The number is not chosen, it is measured. It is the highest rust-version any
# package in the resolved dependency graph declares:
#
#     cargo metadata --format-version 1 | ... | sort by rust_version
#     hashbrown 0.17.1        rust-version 1.85.0
#     indexmap 2.14.0         rust-version 1.85
#     serde_spanned 1.1.1     rust-version 1.85
#     toml 1.1.4              rust-version 1.85
#     toml_datetime 1.1.1     rust-version 1.85
#     toml_parser 1.1.3       rust-version 1.85
#     toml_writer 1.1.2       rust-version 1.85
#
# Nothing in this workspace's own code needs 1.85. If the dependency set stops
# forcing it, this number moves down by measurement rather than by preference,
# and it moves up the same way. Either way it moves here and in #23, not in an
# operator's terminal.
#
# The edition above is a different number with a different purpose and is not
# the floor.
rust-version = "1.85.0"
publish = false

# The lint set, in the tree rather than on a command line, so that what is
# allowed is reviewable and every exception carries the reason it is allowed
# (#21).
#
# Each crate opts in with `lints.workspace = true`, so a new crate that forgets
# the line is linted at the default level rather than at this one. That is a
# gap in the mechanism and it is named here rather than left implicit.
[workspace.lints.clippy]
# Everything clippy turns on by default is an error rather than a warning. A
# warning in a gate that denies warnings is the same thing with an extra step,
# and saying it here means a local `cargo clippy` gives the same verdict as the
# gate does.
all = "deny"

# The numerical lints, named one at a time because they are the ones this
# repository cannot afford to lose and none of them is on by default.
#
# A cast that can silently drop the high bits or the sign of an index, a grid
# size or a sample count.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
# A cast that silently loses precision, which in double-precision numerics is
# the mistake that produces a plausible answer rather than a wrong-looking one.
cast_precision_loss = "deny"
# Comparing floats for equality. The one place this repository wants an exact
# comparison is a control that has to score exactly zero, and that site should
# say so at the site rather than inherit silence from here.
float_cmp = "deny"

# Allowed lints go below this line, one per entry, each with the reason it is
# allowed written beside it. There are none today. An entry with no reason is
# what the review is for.
