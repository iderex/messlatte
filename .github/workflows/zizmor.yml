# Static analysis of the GitHub Actions workflows themselves (zizmor).
#
# No workflow in this tree can write the repository's contents. The only write
# scopes granted anywhere are security-events, for the SARIF uploads, and
# id-token, for the OpenSSF publish in scorecard.yml:
#
#     git grep -nE '^ +[a-z-]+: write' -- .github/workflows
#
# The pattern is anchored at an indented scope line on purpose, so that this
# comment is not itself one of the results.
#
# So the reason to audit these files is not a release with credentials attached.
# It is that they are what decides which checks a change meets before it reaches
# the default branch, and a workflow that can be edited into passing is a gate
# that reports whatever its author wanted it to. A workflow holding write access
# to contents would be a second and larger reason, and the first one that could
# arrive here is the release path in #92.
#
# The gate runs zizmor's regular persona at --min-severity=low: it fails the
# build on any actionable (low/medium/high/critical) security finding -
# template-injection, cache-poisoning, dangerous-triggers, excessive-permissions,
# unpinned-uses, etc. - and uploads that same set to the code-scanning tab. The
# regular persona is the one zizmor documents for CI ("high-signal, low-noise,
# actionable"). The pedantic persona is deliberately NOT used to gate: it adds
# low-severity hygiene findings (undocumented permissions, missing concurrency,
# pin-comment mismatches, unnamed jobs) that are stylistic rather than
# security-blocking, and some of them are blind to why a file is the way it is.
# The unnamed job in dependency-review.yml is the example already in this tree:
# it has no `name:` for a reason written at the job, and the pedantic persona
# would redden it anyway. No issue here holds that backlog today, and this
# comment is not one.
#
# What a new or edited workflow in this repository is held to. It passes this
# gate before it merges. Actions stay SHA-pinned with the version in a comment
# beside the pin. Checkout stays on persist-credentials:false wherever no step
# pushes. A write permission is granted on the job that needs it and never at
# the top of a file. And on the day a job here does publish something, it
# restores no cache, because a cache is writable by anything that can run a job
# on any branch.
name: Workflow Security Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ "**" ]

# Explicit deny-all at workflow level; the job below grants only what it needs.
permissions: {}

# Cancel a superseded run on the same ref so a new push / PR update does not
# queue behind an obsolete scan. This is an audit job, not a publish, so
# cancelling a superseded run is safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the SARIF into the code-scanning tab
      contents: read # checkout the workflows to scan
    env:
      ZIZMOR_VERSION: "1.26.1"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Audit workflows (SARIF for code scanning)
        # --no-build: install zizmor from its prebuilt wheel only, never executing a
        # source-dist build script. --strict-collection: fail closed if any workflow
        # fails to parse, so a malformed/tampered file cannot slip past the audit.
        # --format=sarif always exits 0; the gate step below is what fails the build.
        run: uvx --no-build "zizmor@${ZIZMOR_VERSION}" --strict-collection --min-severity=low --format=sarif . > results.sarif
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SARIF
        # Only upload where the GITHUB_TOKEN can write security events: pushes to main
        # and same-repo human PRs. Fork and Dependabot pull requests run with a
        # read-only token, so the upload is skipped there - the gate step below still
        # runs and blocks on findings. continue-on-error keeps the security gate
        # independent of the upload: a transient code-scanning upload failure must not
        # skip the "Fail on actionable findings" step below.
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
          category: zizmor

      - name: Fail on actionable findings
        run: uvx --no-build "zizmor@${ZIZMOR_VERSION}" --strict-collection --min-severity=low --format=plain .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
